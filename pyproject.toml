[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "backup-project"
version = "2.0.0"
description = "Back up any project directory to a timestamped ZIP, excluding common dev noise."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["backup", "zip", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
# Zero runtime dependencies — pure stdlib
dependencies = []

[project.scripts]
backup_project = "backup_project:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
py-modules = ["backup_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backup_project"]
omit = ["tests/*", "install.py"]

[tool.coverage.report]
show_missing = true
